version: '3.8'

services:
  oracle-db:
    image: gvenzl/oracle-xe:21-slim-faststart
    container_name: hrgenius-oracle-db
    ports:
      - "1521:1521"
    environment:
      - ORACLE_PASSWORD=hrgenius_pwd
      - APP_USER=hrgenius
      - APP_USER_PASSWORD=hrgenius_pwd
    volumes:
      - oracle_data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD-SHELL", "echo 'exit' | sqlplus -L -S hrgenius/hrgenius_pwd@//localhost:1521/XEPDB1 | grep -q 'Connected' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hrgenius-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:oracle:thin:@oracle-db:1521/XEPDB1
      - SPRING_DATASOURCE_USERNAME=hrgenius
      - SPRING_DATASOURCE_PASSWORD=hrgenius_pwd
      - JWT_SECRET=5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437
      - SPRING_FLYWAY_ENABLED=true
    depends_on:
      oracle-db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hrgenius-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  oracle_data:
    driver: local
