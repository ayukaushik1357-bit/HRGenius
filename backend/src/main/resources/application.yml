# ============================================================
# HRGenius — Common Configuration
# ============================================================
server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: hrgenius
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:h2}

  # Default JPA settings (overridden per profile)
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  # File upload limits
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # Mail configuration (configurable SMTP)
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

  # Flyway defaults
  flyway:
    enabled: true
    locations: classpath:db/migration


# JWT Configuration
app:
  jwt:
    secret: ${JWT_SECRET:myDefaultDevSecretKeyThatIsAtLeast256BitsLongForHS256Algorithm123456}
    access-token-expiration-ms: 86400000       # 24 hours (prevents token expiring mid-session)
    refresh-token-expiration-ms: 604800000    # 7 days
  file:
    upload-dir: ${FILE_UPLOAD_DIR:./uploads}

# OpenAPI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

---
# ============================================================
# Profile: h2  (run without Oracle)
# ============================================================
spring:
  config:
    activate:
      on-profile: h2

  datasource:
    url: jdbc:h2:mem:hrgenius;DB_CLOSE_DELAY=-1;MODE=Oracle
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true

  flyway:
    enabled: false

---
# ============================================================
# Profile: dev  (Oracle XE local)
# ============================================================
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:oracle:thin:@localhost:1521/XEPDB1
    username: ${ORACLE_USER:hrgenius}
    password: ${ORACLE_PASS:hrgenius}
    driver-class-name: oracle.jdbc.OracleDriver

  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

---
# ============================================================
# Profile: prod
# ============================================================
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${ORACLE_URL}
    username: ${ORACLE_USER}
    password: ${ORACLE_PASS}
    driver-class-name: oracle.jdbc.OracleDriver

  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true

app:
  jwt:
    secret: ${JWT_SECRET}
